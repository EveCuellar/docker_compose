<h2>Iniciar Sesión</h2>
<input type="text" [(ngModel)]="nombre" placeholder="Usuario">
<input type="password" [(ngModel)]="password" placeholder="Contraseña">
<div>
    <button (click)="ingresar()" onclick="location.href='listado/'">Ingresar</button>
</div>
<div>
    <p style="display: flex;">¿Aún no tienes cuenta? Haz click para <a style="margin: 0; border: 0; background-color: transparent; color: blue;" onclick="location.href='register/'"> Registrarse</a>
    </p>
</div>
