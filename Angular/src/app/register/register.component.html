<div class="register-container">
    <h2>Registro de Usuario</h2>
  
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div>
        <label for="name">Nombre</label>
        <input id="name" formControlName="name" type="text" />
        <div *ngIf="submitted && f.name.errors">
          <small *ngIf="f.name.errors.required">El nombre es obligatorio.</small>
          <small *ngIf="f.name.errors.minlength">El nombre debe tener al menos 2 caracteres.</small>
        </div>
      </div>
  
      <div>
        <label for="email">Correo electrónico</label>
        <input id="email" formControlName="email" type="email" />
        <div *ngIf="submitted && f.email.errors">
          <small *ngIf="f.email.errors.required">El correo es obligatorio.</small>
          <small *ngIf="f.email.errors.email">El formato no es válido.</small>
        </div>
      </div>
  
      <div>
        <label for="password">Contraseña</label>
        <input id="password" formControlName="password" type="password" />
        <div *ngIf="submitted && f.password.errors">
          <small *ngIf="f.password.errors.required">La contraseña es obligatoria.</small>
          <small *ngIf="f.password.errors.minlength">Mínimo 6 caracteres.</small>
        </div>
      </div>
  
      <div>
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input id="confirmPassword" formControlName="confirmPassword" type="password" />
        <div *ngIf="submitted && f.confirmPassword.errors">
          <small *ngIf="f.confirmPassword.errors.required">Confirmar contraseña es obligatorio.</small>
        </div>
        <div *ngIf="submitted && registerForm.errors?.mismatch">
          <small>Las contraseñas no coinciden.</small>
        </div>
      </div>
  
      <button type="submit">Registrarse</button>
    </form>
  </div>
