<div class="register-container">
  <h2>Registro de Usuario</h2>
  <input type="text" [(ngModel)]="nombre" placeholder="nombreDeUsuario">
  <input type="password" [(ngModel)]="password" placeholder="contraseña">
  <div>
    <button (click)="registrar()">Registrarse</button>
    <button onclick="location.href='/'">Volver a inicio de sesion</button>
  </div>
</div>
